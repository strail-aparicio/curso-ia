[project]
name = "curso-ia"
version = "0.1.0"
description = "Curso de Inteligencia Artificial desde cero"
readme = "README.md"
requires-python = ">=3.11"

# Dependencias de las fases 1 y 2. Iremos añadiendo más con `uv add`
# cuando las necesitemos (por ejemplo, PyTorch en el Módulo 8).
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
]

[dependency-groups]
dev = [
    "ipykernel",   # permite ejecutar celdas "# %%" en VSCodium
    "ruff",        # formateo y revisión de código
]
